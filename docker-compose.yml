services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_API_KEY: ${VITE_API_KEY:-}
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://backend:43187}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5190"
    networks:
      - default
      - api
    restart: unless-stopped

networks:
  api:
    external: true
    name: ${API_DOCKER_NETWORK:-logibot_backend_default}

