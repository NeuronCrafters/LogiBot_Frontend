services:
  frontend:
    container_name: logibot_frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_KEY: ${VITE_API_KEY}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
    ports:
      - "3001:80"
    restart: unless-stopped
    networks:
      - logibot-network

networks:
  logibot-network:
    driver: bridge
