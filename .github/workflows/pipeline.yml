name: Deploy via VPS Build

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to Hetzner VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/apps/logibots/LogiBot_Frontend

            # Para qualquer merge em andamento
            git merge --abort 2>/dev/null || true

            # Limpa TUDO - força o uso dos arquivos do Git
            git fetch origin main
            git reset --hard origin/main
            git clean -fdx

            # Cria o .env com os secrets
            cat > .env << 'ENVEOF'
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_API_KEY=${{ secrets.VITE_API_KEY }}
            VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
            ENVEOF

            # Verifica se o .env foi criado corretamente
            echo "=== Verificando .env ==="
            cat .env

            # Verifica o docker-compose.yml
            echo "=== Verificando docker-compose.yml ==="
            cat docker-compose.yml

            # Para e remove tudo
            docker compose down -v 2>/dev/null || true

            # Cria a rede manualmente se não existir
            docker network create logibot-network 2>/dev/null || true

            # Build completo sem cache
            docker compose build --no-cache --pull

            # Sobe os containers
            docker compose up -d --force-recreate

            # Aguarda 5 segundos
            sleep 5

            # Limpa imagens antigas
            docker image prune -af

            # Mostra status
            echo "=== Status dos containers ==="
            docker compose ps

            echo "=== Logs do frontend ==="
            docker compose logs --tail=100 frontend
