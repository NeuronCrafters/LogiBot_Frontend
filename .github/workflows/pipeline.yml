name: Deploy via VPS Build

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to Hetzner VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/apps/logibots/LogiBot_Frontend

            # FORÇA a sobrescrita do docker-compose.yml
            cat > docker-compose.yml << 'COMPOSEEOF'
            services:
              frontend:
                container_name: logibot_frontend
                build:
                  context: .
                  dockerfile: Dockerfile
                  args:
                    VITE_API_BASE_URL: ${VITE_API_BASE_URL}
                    VITE_API_KEY: ${VITE_API_KEY}
                    VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
                ports:
                  - "3001:80"
                restart: unless-stopped
                networks:
                  - logibot-network

            networks:
              logibot-network:
                driver: bridge
            COMPOSEEOF

            # Cria o .env
            cat > .env << 'ENVEOF'
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_API_KEY=${{ secrets.VITE_API_KEY }}
            VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
            ENVEOF

            # Atualiza o código
            git fetch origin main 2>/dev/null || true
            git reset --hard origin/main 2>/dev/null || true

            # Remove qualquer cache do Docker Compose
            rm -rf .docker-compose-cache 2>/dev/null || true

            # Para tudo
            docker compose down -v 2>/dev/null || true

            # Cria a rede
            docker network create logibot-network 2>/dev/null || true

            # Build e sobe
            docker compose build --no-cache --pull
            docker compose up -d --force-recreate

            sleep 5

            # Status
            docker compose ps
            docker compose logs --tail=50 frontend
