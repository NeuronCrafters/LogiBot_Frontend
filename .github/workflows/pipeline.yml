name: Deploy via VPS Build

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to Hetzner VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/apps/logibots/LogiBot_Frontend

            rm -f docker-compose.override.yml docker-compose.override.yaml
            rm -f .env.local .env.production .env.development

            cat > docker-compose.yml << 'COMPOSEEOF'
            services:
              frontend:
                container_name: logibot_frontend
                build:
                  context: .
                  dockerfile: Dockerfile
                  args:
                    VITE_API_BASE_URL: ${VITE_API_BASE_URL}
                    VITE_API_KEY: ${VITE_API_KEY}
                    VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
                ports:
                  - "3001:80"
                restart: unless-stopped
                networks:
                  - logibot-network

            networks:
              logibot-network:
                external: true
            COMPOSEEOF

            cat > .env << 'ENVEOF'
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_API_KEY=${{ secrets.VITE_API_KEY }}
            VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
            ENVEOF

            git fetch origin main 2>/dev/null || true
            git reset --hard origin/main 2>/dev/null || true

            docker compose down 2>/dev/null || true
            docker compose build --no-cache --pull
            docker compose up -d --force-recreate

            sleep 5
            docker compose ps
            docker network inspect logibot-network | grep -A 5 logibot_frontend || echo "Frontend não está na rede!"
